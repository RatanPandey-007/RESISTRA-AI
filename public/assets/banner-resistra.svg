<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="amrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030b14" />
      <stop offset="50%" stop-color="#071927" />
      <stop offset="100%" stop-color="#04121d" />
    </linearGradient>
    <filter id="amrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="amrGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#00f3ff" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
    <linearGradient id="amrTealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', monospace, 'Courier New'; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
  </style>

  <rect width="900" height="240" fill="url(#amrBg)" rx="10" />
  <rect width="900" height="240" fill="url(#amrGrid)" rx="10" />
  <rect x="10" y="10" width="880" height="220" fill="none" stroke="#0e3a4e" stroke-width="1.2" rx="8" />

  <!-- Corner Brackets -->
  <path d="M 10 32 L 10 10 L 32 10" fill="none" stroke="#00f3ff" stroke-width="2.5" />
  <path d="M 868 10 L 890 10 L 890 32" fill="none" stroke="#00f3ff" stroke-width="2.5" />
  <path d="M 10 208 L 10 230 L 32 230" fill="none" stroke="#00f3ff" stroke-width="2.5" />
  <path d="M 868 230 L 890 230 L 890 208" fill="none" stroke="#00f3ff" stroke-width="2.5" />

  <!-- Top System Header -->
  <rect x="25" y="20" width="850" height="24" fill="#061f30" rx="4" stroke="#0d4a66" stroke-width="0.8" />
  <circle cx="38" cy="32" r="3.5" fill="#14b8a6" />
  <text x="50" y="36" fill="#38bdf8" class="mono" font-size="10.5" font-weight="600">AMR-X // EXPLAINABLE AI ANTIMICROBIAL RESISTANCE DIAGNOSTIC SYSTEM</text>
  <rect x="765" y="24" width="95" height="16" fill="#14b8a6" fill-opacity="0.15" rx="3" stroke="#14b8a6" stroke-width="0.8" />
  <text x="774" y="36" fill="#14b8a6" class="mono" font-size="9" font-weight="700">PROTOTYPE LIVE</text>

  <!-- Title & Subtitle -->
  <text x="45" y="96" fill="url(#amrTealGrad)" class="sans" font-size="38" font-weight="900" letter-spacing="3" filter="url(#amrGlow)">AMR-X : PREDICTIVE RESISTANCE</text>
  <text x="45" y="96" fill="#ffffff" class="sans" font-size="38" font-weight="900" letter-spacing="3">AMR-X : PREDICTIVE RESISTANCE</text>
  
  <text x="47" y="124" fill="#5eead4" class="mono" font-size="11.5" font-weight="600" letter-spacing="1.2">
    XGBOOST ENSEMBLE • SHAP TREE-EXPLAINABILITY • 3D THREE.JS PETRI SCENE • FASTAPI ENGINE
  </text>

  <line x1="45" y1="138" x2="650" y2="138" stroke="url(#amrTealGrad)" stroke-width="1.2" />

  <!-- Telemetry Pills -->
  <g transform="translate(45, 155)">
    <rect x="0" y="0" width="160" height="22" fill="#072336" rx="3" stroke="#14b8a6" stroke-width="0.8" />
    <text x="10" y="15" fill="#e2e8f0" class="mono" font-size="10">4 ANTIBIOTIC MODELS</text>

    <rect x="170" y="0" width="170" height="22" fill="#072336" rx="3" stroke="#00f3ff" stroke-width="0.8" />
    <text x="180" y="15" fill="#e2e8f0" class="mono" font-size="10">SHAP FEATURE IMPACT</text>

    <rect x="350" y="0" width="165" height="22" fill="#072336" rx="3" stroke="#10b981" stroke-width="0.8" />
    <text x="360" y="15" fill="#e2e8f0" class="mono" font-size="10">REPORTLAB PDF EXPORT</text>
  </g>

  <!-- Status Log -->
  <text x="45" y="208" fill="#94a3b8" class="mono" font-size="11">
    <tspan fill="#10b981" font-weight="700">ACTIVE TARGETS:</tspan> Ciprofloxacin • Levofloxacin • Nitrofurantoin • Trimethoprim/Sulfamethoxazole
  </text>

  <!-- Right Visual Widget: Petri Dish & Bio Rings -->
  <g transform="translate(765, 125)">
    <circle cx="50" cy="35" r="45" fill="none" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,3" />
    <circle cx="50" cy="35" r="32" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="50" cy="35" r="18" fill="#062d3e" stroke="#10b981" stroke-width="1.5" />
    <circle cx="50" cy="35" r="6" fill="#00f3ff" filter="url(#amrGlow)" />
    <!-- Bacteria colony blips -->
    <circle cx="36" cy="24" r="3" fill="#ec4899" />
    <circle cx="64" cy="42" r="2.5" fill="#14b8a6" />
    <circle cx="58" cy="20" r="2" fill="#38bdf8" />
    <circle cx="40" cy="48" r="2" fill="#eab308" />
  </g>
</svg>
